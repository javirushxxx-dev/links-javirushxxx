<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Javi Rush - Official Links">
    <title>Javi Rush</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated background -->
    <div class="bg-container">
        <div class="grid-bg"></div>
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <!-- Main content -->
    <div class="container">
        <!-- Profile -->
        <div class="profile">
            <div class="avatar">
                <div class="avatar-img" id="avatarContent">JR</div>
            </div>
            <h1 class="name">JAVI RUSH</h1>
            <p class="tagline">the pretty-faced twink dom</p>
        </div>

        <!-- Links -->
        <div class="links" id="linksContainer">
            <!-- Links will be dynamically generated from config.js -->
        </div>

        <!-- Footer -->
        <div class="footer">
            <p id="footerText">© 2024 Javi Rush. All rights reserved.</p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
